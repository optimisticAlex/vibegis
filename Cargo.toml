[package]
name = "vibegis"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Ein kleines GIS im Browser: Rust, WASM und OSM-Adresspunkte"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
csv = "1.4"
geo = { version = "0.33.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
walkers = "0.63"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-streams = "0.5"
js-sys = "0.3"
futures = "0.3"
csv-async = { version = "1.3", default-features = false }
gloo-timers = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "HtmlInputElement", "HtmlAnchorElement", "HtmlElement", "Element", "Node", "File", "FileList", "Blob", "BlobPropertyBag", "Url", "Response", "ReadableStream", "Performance", "AbortController", "AbortSignal", "RequestInit", "console"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flate2 = "1"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 0
