<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#162720">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>vibegis — Dein Blick auf die Stadt</title>
  <link data-trunk rel="rust" data-target-name="vibegis" data-wasm-opt="0">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f5ef;font-family:system-ui,sans-serif;color:#162720}
    canvas{width:100%;height:100%;display:block;outline:none}
    #loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
    #loading strong{font-size:40px;letter-spacing:-2px} #loading p{color:#6b796f}
  </style>
</head>
<body>
  <div id="loading"><strong>vibegis<span style="color:#44a578">.</span></strong><p>Deine Karte wird vorbereitet …</p></div>
  <canvas id="vibegis" aria-label="vibegis: interaktive Karte mit CSV-Import und Polygonauswahl"></canvas>
  <noscript>Bitte JavaScript aktivieren, um die Rust-/WASM-Anwendung zu starten.</noscript>
</body>
</html>
